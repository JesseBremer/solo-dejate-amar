<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Map</title>
    <!-- Leaflet CSS for the map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { background: linear-gradient(135deg, #1a0810 0%, #0f0f0f 100%); color: #e0e0e0; font-family: 'Georgia', serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        button { padding: 10px 20px; cursor: pointer; background: transparent; border: 1px solid #ff6b6b; color: #ff6b6b; border-radius: 5px; transition: 0.3s; font-family: inherit; font-size: 1rem; margin-top: 20px; }
        button:hover { background: #ff6b6b; color: white; }
        .title { color: #ff6b6b; font-family: 'Brush Script MT', 'Lucida Handwriting', cursive; font-size: 3rem; text-align: center; margin-bottom: 5px; text-shadow: 2px 2px 4px rgba(255, 105, 180, 0.2); }
        .subtitle { font-size: 1.1rem; margin-bottom: 25px; text-align: center; color: #aaaaaa; }
        
        #map-container { width: 100%; max-width: 800px; display: flex; flex-direction: column; align-items: center; }
        #map { width: 100%; height: 60vh; min-height: 400px; border-radius: 10px; border: 2px solid #ff69b4; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 1; }
        
        /* Custom Heart Pin Styles */
        .heart-pin { font-size: 24px; text-align: center; line-height: 24px; filter: drop-shadow(0 0 5px rgba(255, 105, 180, 0.8)); animation: pulse-pin 1.5s infinite alternate; }
        @keyframes pulse-pin {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }

        /* Customizing Leaflet Popups for Dark Theme */
        .leaflet-popup-content-wrapper { background: #1a0810; color: #e0e0e0; border: 1px solid #ff69b4; border-radius: 8px; font-family: 'Georgia', serif; }
        .leaflet-popup-tip { background: #1a0810; }
        .leaflet-popup-content b { color: #ff6b6b; font-size: 1.1rem; }
        .leaflet-popup-content p { margin: 5px 0 0 0; font-size: 0.95rem; }
        .leaflet-popup-close-button { color: #ff6b6b !important; }

        @media (max-width: 600px) {
            .title { font-size: 2.3rem; }
            #map { height: 50vh; }
        }
    </style>
</head>
<body>

    <h1 class="title">Our World</h1>
    <p class="subtitle">Every coordinate where our story unfolded.</p>

    <div id="map-container">
        <div id="map"></div>
    </div>

    <button onclick="window.location.href='index.html'">Back</button>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize the map (Centered over Ottawa)
        const map = L.map('map').setView([45.4215, -75.6972], 12);

        // Add a Dark Mode Map Skin (CartoDB Dark Matter)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://carto.com/">CARTO</a>'
        }).addTo(map);

        // Define our custom glowing heart icon
        const heartIcon = L.divIcon({
            html: '❤️',
            className: 'heart-pin',
            iconSize: [24, 24],
            iconAnchor: [12, 12],
            popupAnchor: [0, -10]
        });

        // --- ADD YOUR LOCATIONS HERE ---
        // You can find lat/lng coordinates by right-clicking anywhere on Google Maps
        const locations = [
            {
                lat: 45.4215, lng: -75.6972,
                title: "Ottawa, Ontario, Canada",
                desc: "Where we first met."
            }
        ];

        // Add markers to the map
        locations.forEach(loc => {
            L.marker([loc.lat, loc.lng], { icon: heartIcon })
                .addTo(map)
                .bindPopup(`<b>${loc.title}</b><p>${loc.desc}</p>`);
        });
    </script>

</body>
</html>
